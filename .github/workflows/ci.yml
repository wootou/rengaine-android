# Compile, teste et analyse l'app à chaque push et pull request.
# Aucun secret : la release est signée hors de GitHub (voir RELEASING.md),
# ici elle est signée avec la clé debug, juste pour vérifier R8.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions épinglées par empreinte de commit (version en commentaire).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Vérifie aussi que gradle-wrapper.jar est un wrapper officiel.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: APK debug et release (R8)
        run: ./gradlew assembleDebug assembleRelease

      - name: Liste des licences à jour
        run: |
          ./gradlew :app:exportLibraryDefinitions
          git diff --exit-code app/src/main/res/raw/aboutlibraries.json \
            || { echo "::error::Lancer ./gradlew :app:exportLibraryDefinitions et versionner le résultat."; exit 1; }
